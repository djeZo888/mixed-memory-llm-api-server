name: I2P disposable Linux primitives

on:
  push:
    branches: ['milestone/i2*']
    paths:
      - '.github/workflows/i2p-linux.yml'
      - 'scripts/validation/i2p/**'
      - 'tests/validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-linux-primitives:
    if: github.repository == 'djeZo888/mixed-memory-llm-api-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify source and local safety tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/validation -p 'test_*.py' -v
          python3 scripts/validation/i2p/run.py --dry-run

      - name: Probe fresh hosted VM and actual Linux primitives
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          result=0
          sudo -n /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_TEMP="$RUNNER_TEMP" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            I2P_DISPOSABLE_ACK=github-hosted-ubuntu-24.04 \
            /usr/bin/python3 scripts/validation/i2p/run.py \
            --output-dir "$RUNNER_TEMP/i2p-evidence" || result=$?
          for item in i2p-evidence i2p-evidence/evidence.json i2p-evidence/plan.json i2p-evidence/source-manifest.json; do
            if test -e "$RUNNER_TEMP/$item"; then
              sudo -n chown "$(id -u):$(id -g)" "$RUNNER_TEMP/$item"
            fi
          done
          exit "$result"

      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i2p-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/i2p-evidence/evidence.json
            ${{ runner.temp }}/i2p-evidence/plan.json
            ${{ runner.temp }}/i2p-evidence/source-manifest.json
          if-no-files-found: error
          retention-days: 14
