name: I2SF affected disposable Linux fixture

on:
  push:
    branches: ['milestone/i2sf-loop-fixture']
    paths: ['scripts/validation/i2s/launch.json']

permissions:
  contents: read

jobs:
  affected-loop-fixture:
    if: github.repository == 'djeZo888/mixed-memory-llm-api-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check source identity and ordinary-user safety tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/validation -p 'test_i2s_runner.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/install -p 'test_loop_disk_fixture.py' -v
          python3 scripts/validation/i2s/run.py --dry-run --affected-only
          bash -n tests/install/loop_disk_transaction.sh
          git diff --check HEAD^

      - name: Run guarded affected fixture with scrubbed sudo environment
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          result=0
          sudo -n /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_TEMP="$RUNNER_TEMP" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            I2P_DISPOSABLE_ACK=github-hosted-ubuntu-24.04 \
            /usr/bin/python3 -B scripts/validation/i2s/run.py \
            --apply --affected-only --output-dir "$RUNNER_TEMP/i2s-evidence" || result=$?
          for item in i2s-evidence i2s-evidence/evidence.json i2s-evidence/plan.json i2s-evidence/source-manifest.json; do
            if test -e "$RUNNER_TEMP/$item"; then
              sudo -n chown "$(id -u):$(id -g)" "$RUNNER_TEMP/$item"
            fi
          done
          exit "$result"

      - name: Preserve only sanitized source-bound evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i2s-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/i2s-evidence/evidence.json
            ${{ runner.temp }}/i2s-evidence/plan.json
            ${{ runner.temp }}/i2s-evidence/source-manifest.json
          if-no-files-found: error
          retention-days: 14
