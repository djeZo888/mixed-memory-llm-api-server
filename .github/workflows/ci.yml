name: CI

on:
  push:
  pull_request:

jobs:
  repository-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            README.md
            ROADMAP.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            LICENSE.todo.md
            .gitignore
            .env.example
            docs/project-charter.md
            docs/architecture.md
            docs/hardware-profiles.md
            docs/installation.md
            docs/operations.md
            docs/model-matrix.md
            docs/api-contract.md
            docs/security.md
            docs/testing.md
            docs/troubleshooting.md
            reports/.gitkeep
            tests/fixtures/.gitkeep
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "missing required path: $path"; exit 1; }
          done

      - name: Reject committed secret-like files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -path ./.git -prune -o \( -name .env -o -name '*.key' -o -name '*.pem' -o -name auth.json -o -name MEMORY.md \) -print)
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            exit 1
          fi

      - name: Check markdown local links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import re
          import sys
          failures = []
          pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          root = Path('.').resolve()
          # Immutable historical evidence: these private artifact references are
          # provenance only, not public links. Supplied-input hashes and the
          # q38vr3 source manifest bind the original handoff bytes.
          archived = {
              f'reports/{revision}-evidence/q38vc-source-handoff.md'
              for revision in ('q38vr2', 'q38vr3')
          }
          archive_sha = '222f362d2bba98bedd2c8203584a8322acbba2ae98fd22c76391957386faf787'
          archive_targets = {
              '/Users/agent/LLMServer-orchestration/20260915/Q38VC/' + name
              for name in ('Q38VC.bundle', 'final.md', 'verification.json')
          }
          for md in Path('.').rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8')
              archived_reference = md.as_posix() in archived
              if archived_reference and hashlib.sha256(md.read_bytes()).hexdigest() != archive_sha:
                  failures.append(f'{md}: archived evidence hash mismatch')
                  archived_reference = False
              for match in pattern.finditer(text):
                  target = match.group(1).strip()
                  if archived_reference and target in archive_targets:
                      continue
                  if not target or '://' in target or target.startswith('#') or target.startswith('mailto:'):
                      continue
                  path_part = target.split('#', 1)[0]
                  if not path_part:
                      continue
                  resolved = (md.parent / path_part).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      failures.append(f'{md}: link escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      failures.append(f'{md}: missing local link target: {target}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('markdown-local-links-ok')
          PY

  client-regressions:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select target Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reviewed A1 client suite
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_agent*.py' -v

      - name: Run bootstrap client suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover -s scripts/client/tests -p 'test_*.py' -v
