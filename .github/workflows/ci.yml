name: CI

on:
  push:
  pull_request:

jobs:
  repository-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            README.md
            ROADMAP.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            LICENSE.todo.md
            .gitignore
            .env.example
            docs/project-charter.md
            docs/architecture.md
            docs/hardware-profiles.md
            docs/installation.md
            docs/operations.md
            docs/model-matrix.md
            docs/api-contract.md
            docs/security.md
            docs/testing.md
            docs/troubleshooting.md
            reports/.gitkeep
            tests/fixtures/.gitkeep
          )
          for path in "${required[@]}"; do
            test -e "$path" || { echo "missing required path: $path"; exit 1; }
          done

      - name: Reject committed secret-like files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -path ./.git -prune -o \( -name .env -o -name '*.key' -o -name '*.pem' -o -name auth.json -o -name MEMORY.md \) -print)
          if [ -n "$forbidden" ]; then
            echo "$forbidden"
            exit 1
          fi

      - name: Check markdown local links
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_markdown_links.py
          python3 -m unittest discover -s tests/ci -p test_markdown_links.py -v

  client-regressions:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select target Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reviewed A1 client suite
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_agent*.py' -v

      - name: Run bootstrap client suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover -s scripts/client/tests -p 'test_*.py' -v
