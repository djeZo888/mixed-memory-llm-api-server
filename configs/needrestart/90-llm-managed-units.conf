# H006: defer only these managed units to explicit canonical-owner maintenance.
# Ubuntu needrestart 3.6-7ubuntu4.5 honors override_rc=0 in automatic APT mode
# and still reports the deferred units. Merge; preserve every existing override.
# This does not change package updates, restart mode, or NVIDIA driver policy.
$nrconf{override_rc}->{qr(\Allm-control\.service\z)} = 0;
$nrconf{override_rc}->{qr(\Allm-node\.service\z)} = 0;
$nrconf{override_rc}->{qr(\Allm-image-api\.service\z)} = 0;
$nrconf{override_rc}->{qr(\Allm-image-backend\.service\z)} = 0;
