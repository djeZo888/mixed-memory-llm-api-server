server {
    listen 10.156.100.61:80;
    server_name 10.156.100.61;
    client_max_body_size 50m;
    client_body_timeout 7200s;
    send_timeout 7200s;

    # Only this narrow endpoint may mint human canvas-approval capabilities.
    # Access checks use the actual peer, never caller-supplied forwarded headers.
    # Root must review all host/container egress addresses before activation.
    location ~ ^/api/sessions/[a-zA-Z0-9_-]+/image-jobs/[a-zA-Z0-9_-]+/approval-token$ {
        deny 127.0.0.0/8;
        deny ::1;
        deny 10.156.100.61;
        # Preserve the existing listener/network exposure for external clients.
        allow all;
        limit_except GET { deny all; }
        # Root-owned 0600 include sets X-AI-Harness-Approval-Proxy to the
