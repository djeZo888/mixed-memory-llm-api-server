model = "qwen3.8-27b"
model_provider = "sova"
model_catalog_json = "/opt/sova/codex/models.json"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "disabled"
check_for_update_on_startup = false
allow_login_shell = false
developer_instructions = "Complete the requested work and create requested artifacts before ending the turn. Use available text extraction and metadata when native visual inspection is unavailable. Give the actual answer and artifact paths, or state concrete tool failures and remaining blockers. A statement of intended next steps is not a completed result. Preserve original inputs and report incomplete work honestly."
[analytics]
enabled = false
[feedback]
enabled = false
[features]
view_image = false
multi_agent = true
multi_agent_v2 = false
apps = false
plugins = false
standalone_web_search = false
[model_providers.sova]
name = "Sova local"
base_url = "http://10.0.2.2:8081/v1"
wire_api = "responses"
env_key = "AI_HARNESS_GATEWAY_TOKEN"
requires_openai_auth = false
request_max_retries = 0
stream_max_retries = 0
stream_idle_timeout_ms = 28800000
supports_websockets = false
supports_standalone_web_search = false

[mcp_servers.search]
command = "/usr/local/bin/node"
args = ["/opt/ai-harness/tools/search/searxng-mcp.mjs"]
startup_timeout_sec = 10
tool_timeout_sec = 20
[mcp_servers.search.env]
AI_HARNESS_SEARXNG_URL = "http://10.0.2.2:8082"

[mcp_servers.browser]
command = "/usr/local/bin/node"
args = ["/opt/sova/browser/browser-mcp.mjs"]
startup_timeout_sec = 10
tool_timeout_sec = 30

[mcp_servers.image]
command = "/usr/local/bin/node"
args = ["/opt/ai-harness/tools/image/image-mcp.mjs"]
env_vars = ["AI_HARNESS_GATEWAY_TOKEN"]
enabled_tools = ["image_capabilities", "image_status"]
startup_timeout_sec = 10
tool_timeout_sec = 20

# Root-reviewed technical qualification enables this server through native thread config.
# It remains independent of the creative image catalog and gate.
[mcp_servers.technical_vision]
command = "/usr/local/bin/node"
args = ["/opt/ai-harness/tools/technical-vision/technical-vision-mcp.mjs"]
env_vars = ["AI_HARNESS_GATEWAY_TOKEN"]
enabled = false
enabled_tools = ["technical_vision_capabilities", "technical_image_analyze", "technical_vision_status", "technical_vision_lookup", "technical_vision_cancel"]
startup_timeout_sec = 10
tool_timeout_sec = 60

[agents]
enabled = true
max_concurrent_threads_per_session = 4
max_depth = 1
default_subagent_model = "qwen3.8-27b"
