# Managed, immutable image policy wins over task/workspace configuration.
model_provider = "sova"
model_catalog_json = "/opt/sova/codex/models.json"
allowed_approval_policies = ["never"]
allowed_sandbox_modes = ["danger-full-access"]
allowed_web_search_modes = ["disabled"]
check_for_update_on_startup = false
allow_login_shell = false
allow_managed_hooks_only = true
allow_remote_control = false
allow_browser_and_computer_use = false
[feedback]
enabled = false
[features]
multi_agent = false
multi_agent_v2 = false
apps = false
plugins = false
standalone_web_search = false
[model_providers.sova]
name = "Sova local"
base_url = "http://10.0.2.2:8081/v1"
wire_api = "responses"
env_key = "AI_HARNESS_GATEWAY_TOKEN"
requires_openai_auth = false
request_max_retries = 0
stream_max_retries = 0
stream_idle_timeout_ms = 28800000
supports_websockets = false
supports_standalone_web_search = false
